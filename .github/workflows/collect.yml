name: Collect air quality data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install DuckDB
        run: |
          curl -fsSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/

      - name: Run the pipeline
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Commit new raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "Collect new readings (automated)" || echo "Nothing new to commit"
          git push